name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.11'
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r app/requirements.txt
            - name: Run ruff
              run: |
                ruff check app/
    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: testdb
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres -d testdb"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        steps:
            - uses: actions/checkout@v3
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.11'
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r app/requirements.txt
            - name: Run tests
              env:
                DB_HOST: localhost
                DB_PORT: 5432
                DB_USER: postgres
                DB_PASSWORD: postgres
                DB_NAME: testdb
              run: |
                pytest -v app/tests/
            
    build:
        needs: 
            - lint
            - test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Build Docker image
              run: |
                docker build \
                -f dockerfile \
                -t test-devops:${{github.sha}} \
                .
            - name: Scan Docker Image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: test-devops:${{github.sha}}
                severity: CRITICAL
                ignore-unfixed: true
                exit-code: 1
