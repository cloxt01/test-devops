---
- hosts: servers
  become: true
  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: '0755'
    - name: Deploy file
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ app_dir }}/"
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: '0755'
      loop:
        - "{{ '/../../docker' }}"
        - "{{ '/../../app' }}"
    - name: Deploy application
      ansible.builtin.command:
        cmd: docker compose -f docker/compose.yaml up -d
        chdir: "{{ app_dir }}"
