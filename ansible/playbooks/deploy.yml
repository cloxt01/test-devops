---
- hosts: servers
  become: "{{ ansible_become | default(true) }}"
  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
    - name: Deploy file
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ app_dir }}/"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      loop:
        - "{{ './../../docker' }}"
        - "{{ './../../app' }}"
        - "{{ './../../prometheus' }}"
        - "{{ './../../grafana' }}"
    - name: Deploy application
      ansible.builtin.command:
        cmd: docker compose -f docker/compose.yaml up -d
        chdir: "{{ app_dir }}"
