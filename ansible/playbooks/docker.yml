---
- hosts: servers
  become: "{{ ansible_become | default(true) }}"
  tasks:
    - name: Install prerequisites dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
    - name: Create keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
    - name: Create Docker repository sources file (DEB822 format)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: '0644'
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Architectures: {{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
          Signed-By: /etc/apt/keyrings/docker.asc
    - name: Update cache
      ansible.builtin.apt:
        update_cache: yes
    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
    - name: Start Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
