services:
  db:
    container_name: db-server
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - .env:/app/.env
  app:
    container_name: app-server
    build:
      context: ..
      dockerfile: docker/dockerfile
    env_file:
      - .env
    ports:
      - "80:${APP_PORT}"
    depends_on:
      - db

volumes:
  postgres_data:
